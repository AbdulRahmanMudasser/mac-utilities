name: MacUtilities

options:
  minimumXcodeGenVersion: "2.46.0"
  deploymentTarget:
    macOS: "26.6"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Configuration/Build.xcconfig
  Release: Configuration/Build.xcconfig

fileGroups:
  - Configuration

targets:
  Mac Utilities:
    type: application
    platform: macOS
    dependencies:
      - sdk: CoreWLAN.framework
      - target: Mac UtilitiesWidgets
        embed: true
        codeSign: true
        link: false
    sources:
      - path: MacUtilities
        excludes:
          - "**/.DS_Store"
      - path: MacUtilitiesWidgets/UsageWidgetConfigurationIntent.swift
      - path: Shared
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: UtilityIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Configuration/MacUtilities.entitlements
        COMBINE_HIDPI_IMAGES: "YES"
        ENABLE_APP_SANDBOX: "YES"
        ENABLE_INCOMING_NETWORK_CONNECTIONS: "YES"
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: "YES"
        ENABLE_PREVIEWS: "YES"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        ENABLE_USER_SELECTED_FILES: readonly
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: Configuration/Info.plist
        INFOPLIST_PREPROCESS: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.abdulrahman.mac-utilities
        PRODUCT_MODULE_NAME: Mac_Utilities
        PRODUCT_NAME: "$(TARGET_NAME)"
        REGISTER_APP_GROUPS: "NO"
        STRING_CATALOG_GENERATE_SYMBOLS: "YES"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: "YES"
      configs:
        Debug:
          INFOPLIST_PREPROCESSOR_DEFINITIONS: DEBUG=1

  Mac UtilitiesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Mac UtilitiesTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Mac Utilities
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/../Frameworks"
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.abdulrahman.mac-utilities.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mac Utilities.app/Contents/MacOS/Mac Utilities"
        STRING_CATALOG_GENERATE_SYMBOLS: "NO"
        SWIFT_EMIT_LOC_STRINGS: "NO"

  Mac UtilitiesWidgets:
    type: app-extension
    platform: macOS
    dependencies:
      - sdk: AppIntents.framework
      - sdk: Charts.framework
      - sdk: WidgetKit.framework
    sources:
      - path: MacUtilitiesWidgets
        excludes:
          - "**/.DS_Store"
      - path: Shared/Usage/UsageBytes.swift
      - path: Shared/Usage/UsageHistory.swift
      - path: Shared/Usage/UsageFormatting.swift
      - path: Shared/Usage/UsageWidgetSnapshot.swift
      - path: Shared/Usage/UsageRoute.swift
      - path: Shared/Usage/UsageWidgetPresentation.swift
      - path: Shared/Storage/UsageStorageLimits.swift
      - path: Shared/Storage/UsageStoragePaths.swift
      - path: Shared/Storage/UsageWidgetSnapshotReader.swift
      - path: Shared/Presentation/UsageChartPresentation.swift
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: "YES"
        CODE_SIGN_ENTITLEMENTS: Configuration/MacUtilitiesWidgets.entitlements
        ENABLE_APP_SANDBOX: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: Configuration/MacUtilitiesWidgets-Info.plist
        INFOPLIST_PREPROCESS: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: com.abdulrahman.mac-utilities.widgets
        PRODUCT_NAME: "$(TARGET_NAME)"
        REGISTER_APP_GROUPS: "NO"
        SKIP_INSTALL: "YES"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: "YES"
      configs:
        Debug:
          INFOPLIST_PREPROCESSOR_DEFINITIONS: DEBUG=1

schemes:
  Mac Utilities:
    build:
      targets:
        Mac Utilities: all
        Mac UtilitiesTests: [test]
      parallelizeBuild: true
      buildImplicitDependencies: true
    run:
      config: Debug
    test:
      config: Debug
      macroExpansion: Mac Utilities
      targets:
        - name: Mac UtilitiesTests
          parallelizable: false
      environmentVariables:
        - variable: MACUTILITIES_SIGNED_STABILITY_CHECK
          value: "$(MACUTILITIES_SIGNED_STABILITY_CHECK)"
          isEnabled: true
        - variable: UTILITIES_VERIFICATION_ROOT
          value: "$(UTILITIES_VERIFICATION_ROOT)"
          isEnabled: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
    management:
      shared: true
